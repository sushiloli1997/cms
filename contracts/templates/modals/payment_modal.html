<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form action="{% url 'update-payment-status' datas.id %}" method="POST">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Update Payment Status</h5>
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Remarks</label>
            <textarea class="form-control" name="comment" required placeholder="Enter remarks"></textarea>
          </div>
          <div class="form-group">
            <label>Payment Type</label>
            <select id="payment-select" name="payment_type" class="form-control" required>
              <option value="">Select payment type</option>
              <option value="full">Full Payment</option>
              <option value="partial">Partial Payment</option>
            </select>
          </div>
          <div id="partial-payment-input" class="form-group" style="display: none;">
            <label>Partial Payment Amount</label>
            <input type="text" name="amount" class="form-control" placeholder="Enter partial amount">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-info">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
