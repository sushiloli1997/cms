<div class="modal fade" id="comissionModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form action="{% url 'add-comission' datas.id %}" method="POST">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Add Commission</h5>
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Commission Amount</label>
            <input type="text" name="comission_amount" class="form-control" required placeholder="Enter amount">
          </div>
          <div class="form-group">
            <label>Remarks</label>
            <textarea class="form-control" name="comment" required placeholder="Enter remarks"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
