{% extends 'layouts/base.html' %}
{%  load static %}
{% block content %}


<div>
    <div class="container">
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="name">Office Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ office.office_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Office Address</label>
                        <input type="text" class="form-control" id="name" name="address" value="{{ office.address }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">PAN No:</label>
                        <input type="text" class="form-control" id="name" name="pan_no"  value="{{ office.pan_no     }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Documents</label>
                        <input type="file" class="form-control" id="name" name="document" value="{{ office.document  }}" required>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger"  data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>


                </form>

            </div>
        </div>
    </div>

{% endblock %}
